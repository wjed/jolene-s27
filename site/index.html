<!doctype html>
<html lang="en" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Finder, Summer 2027</title>
<meta name="description" content="Summer 2027 undergraduate research programs: deadlines, eligibility and an application tracker.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%94%AC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script>
  // Applied before first paint so a dark-mode user never sees a white flash.
  try {
    var saved = localStorage.getItem("jolene-s27:theme");
    if (saved) document.documentElement.dataset.theme = saved;
  } catch (e) {}
</script>
<link rel="stylesheet" href="assets/styles.css?v=97afd821">
</head>
<body>

<a class="skip-link" href="#page">Skip to content</a>

<div class="app">

  <!-- ===================== sidebar ===================== -->
  <aside class="sidebar" id="sidebar" data-open="false">
    <div class="ws">
      <span class="ws__icon">🔬</span>
      <span class="ws__name">Research Finder</span>
    </div>

    <nav class="nav" id="pagenav" role="tablist" aria-label="Pages">
      <button role="tab" data-view="plan" aria-selected="true">
        <span class="emoji">🎯</span><span class="label">The Plan</span>
      </button>
      <button role="tab" data-view="programs" aria-selected="false">
        <span class="emoji">📊</span><span class="label">All Programs</span><span class="n" id="n-programs"></span>
      </button>
      <button role="tab" data-view="tracker" aria-selected="false">
        <span class="emoji">✅</span><span class="label">My Applications</span><span class="n" id="n-tracker"></span>
      </button>
      <button role="tab" data-view="timeline" aria-selected="false">
        <span class="emoji">🗓️</span><span class="label">Timeline</span>
      </button>
    </nav>

    <div class="side-section">Me</div>
    <nav class="nav" id="menav" role="tablist" aria-label="My details">
      <button role="tab" data-view="profile" aria-selected="false">
        <span class="emoji">🎓</span><span class="label">My eligibility</span><span class="n" id="n-fit"></span>
      </button>
      <button role="tab" data-view="add" aria-selected="false">
        <span class="emoji">➕</span><span class="label">Add a program</span><span class="n" id="n-mine"></span>
      </button>
      <button role="tab" data-view="kit" aria-selected="false">
        <span class="emoji">✨</span><span class="label">Your Claude kit</span>
      </button>
    </nav>

    <div class="side-section">Guides &amp; templates</div>
    <nav class="nav" id="guidenav" role="tablist" aria-label="Guides"></nav>

    <div class="side-section">Downloads</div>
    <nav class="nav">
      <a href="data/deadlines.ics" download>
        <span class="emoji">📅</span><span class="label">Add to calendar</span>
      </a>
      <a href="data/programs.csv" download>
        <span class="emoji">📄</span><span class="label">Export spreadsheet</span>
      </a>
    </nav>

    <div class="sidebar__foot">
      <span id="foot-meta"></span>
      <span>Your progress is saved in this browser only.</span>
    </div>
  </aside>

  <!-- ===================== main ===================== -->
  <div class="main">
    <header class="topbar">
      <button class="tbtn menu-btn" id="menu-btn" aria-label="Menu">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="crumb">
        <span>🔬</span><span>Research Finder</span>
        <span class="sep">/</span>
        <span class="here" id="crumb-page">The Plan</span>
      </div>
      <div class="topbar__right">
        <button class="tbtn" id="theme-btn" title="Light / dark">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4"/></svg>
          <span class="sr-only">Switch between light and dark</span>
        </button>
        <button class="tbtn" id="export-btn" title="Save your progress to a file">Backup</button>
        <button class="tbtn" id="import-btn" title="Restore a backup">Restore</button>
        <input type="file" id="import-file" accept="application/json.json" class="sr-only" aria-label="Choose a tracker backup file to restore">
      </div>
    </header>

    <main class="page" id="page" tabindex="-1">
      <div class="loading" id="loading">Loading…</div>

      <div id="page-head" hidden>
        <div class="page__icon" id="page-icon">🎯</div>
        <h1 class="page__title" id="page-title">The Plan</h1>
        <p class="page__sub" id="page-sub"></p>
      </div>

      <div class="views" id="views" hidden role="tablist" aria-label="Views"></div>
      <div class="toolbar" id="toolbar" hidden></div>
      <div class="filterbar" id="filterbar" hidden></div>

      <div id="content"></div>
    </main>
  </div>
</div>

<div class="scrim" id="scrim" data-open="false"></div>
<aside class="peek" id="peek" data-open="false" role="dialog" aria-modal="true" aria-labelledby="peek-title" tabindex="-1">
  <div class="peek__bar">
    <button class="tbtn" id="peek-close" aria-label="Close">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <span class="crumb"><span class="sep">Program</span></span>
    <div class="topbar__right">
      <a class="tbtn" id="peek-open" target="_blank" rel="noopener noreferrer">Open page ↗</a>
    </div>
  </div>
  <div class="peek__body" id="peek-body"></div>
</aside>

<script src="assets/app.js?v=79b8bb55"></script>
</body>
</html>
