name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      # build.py imports the guide, kit and watcher summary scripts, which
      # render materials/ and claude-kit/ into site/, so an edit to any of
      # these changes what the site serves.
      - "scripts/**"
      - "materials/**"
      - "claude-kit/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Rebuild rather than trusting what is committed, so the published site
      # can never drift from data/sources/.
      - name: Build dataset
        run: python scripts/build.py

      # The build checks that each record is well formed. This catches what it
      # cannot, such as a deadline that has already passed or a value the site
      # has no label for. Any error fails the step, so nothing is uploaded and
      # the live site keeps its last good copy.
      - name: Check the data
        run: python scripts/qa.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
