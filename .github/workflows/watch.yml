name: Watch program pages

# Most Summer 2027 cycles were not posted when this dataset was built, so the
# point of this job is to notice the week a program page changes, which is
# almost always the week the new dates appear.

on:
  schedule:
    # Mondays, 13:00 UTC (early morning US).
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dataset
        run: python scripts/build.py

      - name: Check every program page
        id: watch
        # Exit codes are informational (1 broken, 2 changed, 3 both), so never
        # fail the job on them.
        run: |
          set +e
          python scripts/watch.py --quiet
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit updated watch state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/watch-state.json data/watch-report.md
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: weekly watch run $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open an issue when something changed
        if: steps.watch.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Program pages changed: $(date -u +%Y-%m-%d)"
          gh issue create \
            --title "$title" \
            --body-file data/watch-report.md \
            --label "watch" || \
          gh issue create --title "$title" --body-file data/watch-report.md
